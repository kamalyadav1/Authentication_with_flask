<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
        }
        .form-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .flash-messages {
            color: red;
            margin-bottom: 15px;
            text-align: center;
        }
        /* Style for the login redirection section */
        .login-redirect {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .login-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 15px;
            border: 1px solid #007BFF;
            border-radius: 4px;
            color: #007BFF;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
        }
        .login-btn:hover {
            background-color: #007BFF;
            color: white;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create an Account</h2>

        <!-- Display Error Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <p style="color: {{ 'green' if category == 'success' else 'red' }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            <div class="form-group">
                <label for="card_number">Card Number</label>
                <!-- Pattern forces a standard 16-digit card number format -->
                <input type="text" id="card_number" name="card_number" pattern="\d{16}" title="Please enter a valid 16-digit card number" required placeholder="1234567812345678">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>

        <!-- Login Redirect Button Section -->
        <div class="login-redirect">
            <p>Already have an account?</p>
            <a href="/login" class="login-btn">Login Here</a>
        </div>
    </div>
</body>
</html>
